<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Soluna Theme Toggle</title>

  <style>
    /* =========================================================
       DEMO PAGE
       ========================================================= */

    * {
      box-sizing: border-box;
    }

    :root {
      --page-bg: #f5f5f3;
      --page-text: #171717;
    }

    :root[data-theme="dark"] {
      --page-bg: #111;
      --page-text: #f5f5f5;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;

      background: var(--page-bg);
      color: var(--page-text);

      transition:
        background-color 0.35s ease,
        color 0.35s ease;
    }


    /* =========================================================
       SOLUNA THEME TOGGLE
       Original component code — DO NOT MODIFY
       ========================================================= */

    .ts-toggle-wrapper {
      --ts-color: #ffc700;

      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 2em;
      height: 2em;
    }

    /* Hidden Input */
    .ts-switch {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    /* Toggle */
    .ts-toggle {
      width: 3.5em;
      height: 3.5em;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
    }

    .ts-toggle svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Base Circle */
    .ts-base-circle {
      fill: none;
      stroke: var(--ts-color);
      stroke-width: 1px;
    }

    /* Sun / Moon */
    .ts-sun-path,
    .ts-moon-path {
      fill: none;
      stroke: var(--ts-color);
      stroke-width: 1px;
      stroke-linecap: round;
      stroke-dasharray: 62;

      transition:
        stroke-dashoffset 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .ts-visible {
      stroke-dashoffset: 0;
    }

    .ts-hidden {
      stroke-dashoffset: 62;
    }

    /* Sun Dots */
    .ts-sun-dots .ts-dot-group {
      transform-origin: 12px 12px;

      transition:
        transform 0.65s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .ts-sun-dots circle {
      fill: var(--ts-color);

      transform-origin: 12px 12px;
      transform: translateY(-13px);

      opacity: 0.85;

      transition:
        transform 0.45s cubic-bezier(0.4, 0, 0.2, 1),
        opacity 0.2s ease;
    }

    /* Initial Dot Positions */
    .ts-sun-dots .ts-dot-group:nth-child(1) {
      transform: rotate(-51.4deg);
    }

    .ts-sun-dots .ts-dot-group:nth-child(2) {
      transform: rotate(0deg);
    }

    .ts-sun-dots .ts-dot-group:nth-child(3) {
      transform: rotate(51.4deg);
    }

    .ts-sun-dots .ts-dot-group:nth-child(4) {
      transform: rotate(102.8deg);
    }

    .ts-sun-dots .ts-dot-group:nth-child(5) {
      transform: rotate(154.2deg);
    }

    .ts-sun-dots .ts-dot-group:nth-child(6) {
      transform: rotate(205.6deg);
    }

    .ts-sun-dots .ts-dot-group:nth-child(7) {
      transform: rotate(257deg);
    }

    /* Active State */
    .ts-switch:checked + .ts-toggle .ts-sun-path {
      stroke-dashoffset: 62;
    }

    .ts-switch:checked + .ts-toggle .ts-moon-path {
      stroke-dashoffset: 0;
    }

    /* Dot Rotation */
    .ts-switch:checked + .ts-toggle .ts-sun-dots .ts-dot-group:nth-child(1) {
      transform: rotate(-231.4deg);
    }

    .ts-switch:checked + .ts-toggle .ts-sun-dots .ts-dot-group:nth-child(2) {
      transform: rotate(-180deg);
    }

    .ts-switch:checked + .ts-toggle .ts-sun-dots .ts-dot-group:nth-child(3) {
      transform: rotate(-128.6deg);
    }

    .ts-switch:checked + .ts-toggle .ts-sun-dots .ts-dot-group:nth-child(4) {
      transform: rotate(-77.2deg);
    }

    .ts-switch:checked + .ts-toggle .ts-sun-dots .ts-dot-group:nth-child(5) {
      transform: rotate(-25.8deg);
    }

    .ts-switch:checked + .ts-toggle .ts-sun-dots .ts-dot-group:nth-child(6) {
      transform: rotate(25.6deg);
    }

    .ts-switch:checked + .ts-toggle .ts-sun-dots .ts-dot-group:nth-child(7) {
      transform: rotate(77deg);
    }

    /* Collapse Dots */
    .ts-switch:checked + .ts-toggle .ts-sun-dots circle {
      opacity: 0;
      transform: translateY(0) scale(0);
    }

    /* Accessibility */
    .ts-switch:focus-visible + .ts-toggle {
      outline: 2px solid var(--ts-color);
      outline-offset: 4px;
      border-radius: 50%;
    }

    /* Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      .ts-sun-path,
      .ts-moon-path,
      .ts-sun-dots .ts-dot-group,
      .ts-sun-dots circle {
        transition: none;
      }
    }


    /* =========================================================
       DEMO CONTENT
       ========================================================= */

    .demo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      text-align: center;
    }

    .demo-title {
      margin: 0;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .demo-description {
      margin: -14px 0 0;
      font-size: 14px;
      opacity: 0.55;
    }

    .demo-status {
      margin: 0;
      font-size: 12px;
      font-family: monospace;
      opacity: 0.45;
    }
  </style>
</head>

<body>

  <main class="demo">

    <h1 class="demo-title">
      Soluna Theme Toggle
    </h1>

    <p class="demo-description">
      Click the toggle to change the page theme.
    </p>


    <!-- =======================================================
         ORIGINAL COMPONENT
         ======================================================= -->

    <div class="ts-toggle-wrapper">

      <input
        type="checkbox"
        id="ts-switch"
        class="ts-switch"
        aria-label="Toggle Theme"
      />

      <label
        for="ts-switch"
        class="ts-toggle"
        aria-label="Toggle Theme"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">

          <!-- Sun Dots -->
          <g class="ts-sun-dots">

            <g class="ts-dot-group">
              <circle cx="12" cy="12" r="0.9"></circle>
            </g>

            <g class="ts-dot-group">
              <circle cx="12" cy="12" r="0.9"></circle>
            </g>

            <g class="ts-dot-group">
              <circle cx="12" cy="12" r="0.9"></circle>
            </g>

            <g class="ts-dot-group">
              <circle cx="12" cy="12" r="0.9"></circle>
            </g>

            <g class="ts-dot-group">
              <circle cx="12" cy="12" r="0.9"></circle>
            </g>

            <g class="ts-dot-group">
              <circle cx="12" cy="12" r="0.9"></circle>
            </g>

            <g class="ts-dot-group">
              <circle cx="12" cy="12" r="0.9"></circle>
            </g>

          </g>

          <!-- Base Circle -->
          <path
            class="ts-base-circle"
            d="M12,2C6.5,2,2,6.5,2,12s4.5,10,10,10s10-4.5,10-10"
          ></path>

          <!-- Sun -->
          <path
            class="ts-sun-path ts-visible"
            d="M12,2 A10,10 0 0,1 22,12"
          ></path>

          <!-- Moon -->
          <path
            class="ts-moon-path ts-hidden"
            d="M12,2c-2.8,2.8-2.8,7.2,0,10s7.2,2.8,10,0"
          ></path>

        </svg>
      </label>

    </div>


    <p
      id="theme-status"
      class="demo-status"
      aria-live="polite"
    >
      Light mode
    </p>

  </main>


  <!-- =========================================================
       DEMO THEME LOGIC
       Only controls the page theme.
       The component itself is untouched.
       ========================================================= -->

  <script>
    const root = document.documentElement;
    const toggle = document.getElementById("ts-switch");
    const status = document.getElementById("theme-status");

    function updateTheme() {
      const isDark = toggle.checked;

      root.dataset.theme = isDark ? "dark" : "light";

      status.textContent = isDark
        ? "Dark mode"
        : "Light mode";
    }

    toggle.addEventListener("change", updateTheme);

    updateTheme();
  </script>

</body>
</html>
